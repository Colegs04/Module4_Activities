<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Fetch JSON Activity</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			padding: 40px;
			background: #f4f6f9;
		}

		.page-content {
			max-width: 700px;
			margin: auto;
		}

		.card-body {
			background: white;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 4px 10px rgba(0,0,0,0.05);
			list-style: none;
		}

		.card-body li {
			padding: 10px;
			border-bottom: 1px solid #eee;
		}
	</style>
</head>
<body>

	<div class="page-content">
		
		<h2>Student List</h2>
		
		<ul id="student-list" class="card-body"></ul>

	</div>

	<script>
		const jsonURL = "https://yourusername.github.io/students.json";

		fetch(jsonURL)
		.then(response => response.json())
		.then(data => {

			let studentList = document.getElementById("student-list");

			if (data.students && Array.isArray(data.students)) {

				data.students.forEach(student => {

					let listItem = document.createElement("li");
					listItem.textContent = `${student.name} - ${student.age} (Course: ${student.course})`;

					studentList.appendChild(listItem);

				});

			} else {
				console.error("Expected 'students' array but got:", data);
			}

		})
		.catch(error => console.error("Error fetching JSON:", error));
	</script>

</body>
</html>
